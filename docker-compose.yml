services:
  postgres_db:
    image: postgres:15
    container_name: smartreco_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: smartreco-redis
    ports:
      - "6379:6379"
    restart: always
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts localhost,mlflow,mlflow_server
  airflow_postgres:
      image: postgres:15
      container_name: airflow_postgres
      environment:
        POSTGRES_USER: airflow
        POSTGRES_PASSWORD: airflow
        POSTGRES_DB: airflow
      volumes:
        - airflow_postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
        interval: 5s
        timeout: 5s
        retries: 5

  airflow-init:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      container_name: airflow_init
      depends_on:
        airflow_postgres:
          condition: service_healthy
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: "3154c1b81696e4fb776983ba28fc4115"
        POSTGRES_HOST: postgres_db
        REDIS_HOST: redis
        MLFLOW_TRACKING_URI: http://mlflow:5000
      entrypoint: /bin/bash
      command:
        - -c
        - |
          airflow db migrate
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      container_name: airflow_webserver
      restart: always
      depends_on:
        - airflow-init
      env_file:
        - .env
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: "3154c1b81696e4fb776983ba28fc4115"
        POSTGRES_HOST: postgres_db
        REDIS_HOST: redis
        MLFLOW_TRACKING_URI: http://mlflow:5000
      ports:
        - "8080:8080"
      volumes:
        - ./dags:/opt/airflow/dags
        - .:/opt/airflow/smartreco
      command: webserver

  airflow-scheduler:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      container_name: airflow_scheduler
      restart: always
      depends_on:
        - airflow-init
      env_file:
        - .env
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: "3154c1b81696e4fb776983ba28fc4115"
        POSTGRES_HOST: postgres_db
        REDIS_HOST: redis
        MLFLOW_TRACKING_URI: http://mlflow:5000
      volumes:
        - ./dags:/opt/airflow/dags
        - .:/opt/airflow/smartreco
      command: scheduler
volumes:
  postgres_data:
  mlflow_data:
  airflow_postgres_data: